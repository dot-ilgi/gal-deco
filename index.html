<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1420">
<meta property="og:title" content="갸루 데코샵">
<meta property="og:description" content="얼굴형부터 네일까지 골라 꾸미는 도트 갸루 게임">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>갸루 데코샵</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dongle:wght@400;700&family=Rampart+One&display=swap">
<style>
/* Layout: one-screen phone app — header, stage (flex), 5 groups, sub-chips, swipe item row, color row, action bar. Leopard desk behind a black deco-phone shell. Single dark theme by choice. */
:root{
  --shell:#1d1420; --shell2:#2b1d31; --line:#4a3550;
  --pink:#ff4fa3; --baby:#ffc2e0; --silver:#ece8f4; --gold:#ffcf4a;
  --leo:#e8b46a; --leo-d:#3b2a20; --leo-m:#c98f45; --tile:#fff6fb;
  --f-ui:"Dongle","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-deco:"Rampart One","Arial Black",sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;margin:0;overflow:hidden;
  background-color:var(--leo);
  background-image:
    radial-gradient(ellipse 7px 5px at 20% 25%,var(--leo-d) 55%,transparent 60%),
    radial-gradient(ellipse 5px 7px at 70% 15%,var(--leo-d) 55%,transparent 60%),
    radial-gradient(ellipse 6px 5px at 45% 65%,var(--leo-d) 55%,transparent 60%),
    radial-gradient(ellipse 5px 6px at 85% 75%,var(--leo-d) 55%,transparent 60%),
    radial-gradient(ellipse 9px 7px at 45% 65%,var(--leo-m) 60%,transparent 64%);
  background-size:56px 56px;
  color:var(--silver);font-family:var(--f-ui);font-size:22px;line-height:1;
  padding-left:max(8px,env(safe-area-inset-left,0px));
  padding-right:max(8px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100%;max-width:480px;margin:0 auto;padding-block:6px;display:flex;flex-direction:column}
.shell{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;background:var(--shell);border:3px solid var(--pink);border-radius:22px;padding:7px;box-shadow:0 0 0 3px var(--shell),0 5px 0 3px var(--leo-d)}

.top{display:flex;align-items:center;gap:6px;padding:0 2px}
.logo{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;overflow:hidden}
.logo b{font-size:28px;font-weight:700;color:var(--baby);white-space:nowrap}
.logo span{font-family:var(--f-deco);font-size:11px;color:var(--gold);letter-spacing:.06em;white-space:nowrap}
.mini{flex:0 0 auto;border:2px solid var(--line);border-radius:999px;padding:3px 9px 0;font-size:18px;color:var(--silver);white-space:nowrap}
.mini[aria-pressed="true"]{border-color:var(--pink);background:var(--pink);color:#ffffff}

.stage{flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;background:#ffd1e6;border:2px solid var(--line)}
#view{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges}
.bob{animation:bob 1.2s steps(1) infinite}
.dance{animation:dance .385s steps(1) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes dance{50%{transform:translateY(-5px) rotate(-1.5deg)}}
.meter{position:absolute;left:7px;top:7px;background:var(--shell);border:2px solid var(--pink);border-radius:999px;padding:3px 9px 0;font-size:18px;color:var(--baby);display:flex;gap:5px;align-items:baseline}
.meter b{font-family:var(--f-deco);font-weight:400;font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums}
.nailbox{position:absolute;right:7px;bottom:7px;width:92px;height:92px;background:var(--tile);border:2px solid var(--pink);border-radius:12px;display:grid;place-items:center}
.nailbox canvas{width:84px;height:84px;image-rendering:pixelated}

.groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.grp{background:var(--shell2);border-radius:9px;padding:5px 0 2px;font-size:20px;text-align:center;color:var(--silver)}
.grp[aria-selected="true"]{background:var(--pink);color:#ffffff;font-weight:700}
.scroll{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.scroll::-webkit-scrollbar{display:none}
.sub{flex:0 0 auto;padding:4px 10px 1px;border-radius:999px;border:2px solid var(--line);font-size:18px;white-space:nowrap;color:var(--silver)}
.sub[aria-pressed="true"]{border-color:var(--pink);color:#ffffff;background:var(--shell2)}
.sub:last-child,.it:last-child,.dot:last-child,.chip:last-child{margin-right:24px}

.cap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 3px;font-size:20px}
.cap b{color:var(--gold);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap span{font-size:16px;color:var(--baby);white-space:nowrap}
.items{padding-bottom:1px;scroll-snap-type:x proximity}
.it{flex:0 0 auto;width:58px;height:58px;scroll-snap-align:start;background:var(--tile);border-radius:10px;border:2px solid transparent;display:grid;place-items:center;overflow:hidden;color:#8a5a7a;font-size:18px}
.it canvas{width:90%;height:90%;object-fit:contain;image-rendering:pixelated}
.it[aria-pressed="true"]{border-color:var(--pink);box-shadow:inset 0 0 0 2px var(--gold)}
.it.empty{background:var(--shell2);color:var(--baby)}
.sw{align-items:center;min-height:28px;padding:1px 0}
.sw .lbl{flex:0 0 auto;font-size:16px;color:var(--baby);margin:0 1px 0 6px;white-space:nowrap}
.sw .lbl:first-child{margin-left:0}
.dot{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--shell2);box-shadow:0 0 0 1px var(--line)}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--gold);border-color:var(--shell)}
.chip{flex:0 0 auto;border-radius:999px;padding:3px 9px 0;font-size:17px;background:var(--shell2);color:var(--silver);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--shell);font-weight:700}

.bar{display:grid;grid-template-columns:1fr 2.2fr;gap:6px}
.btn{border-radius:14px;padding:7px 0 4px;font-size:23px;font-weight:700;background:var(--shell2);color:var(--silver);border:2px solid var(--line)}
.btn.go{background:var(--pink);color:#ffffff;border-color:var(--gold);box-shadow:0 3px 0 #b02a6e}
.btn:active{transform:translateY(2px)}

.modal{position:fixed;inset:0;z-index:20;background:rgba(29,20,32,.74);display:grid;place-items:center;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.card{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--shell);border:3px solid var(--pink);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:7px}
.rhead{text-align:center;font-size:26px;font-weight:700;color:var(--baby)}
.rbody{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.rbody img{height:min(32vh,220px);width:auto;max-width:40vw;border-radius:12px;border:2px solid var(--line);image-rendering:pixelated;display:block}
.rinfo{display:flex;flex-direction:column;gap:5px;min-width:0}
.grade{font-family:var(--f-deco);font-size:52px;color:var(--gold);line-height:.9}
.rank{font-size:26px;font-weight:700;color:#ffffff;text-wrap:balance}
.score{font-size:20px;color:var(--baby)}
.score b{font-family:var(--f-deco);font-weight:400;font-size:22px;color:var(--pink);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.st{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:6px;align-items:center;font-size:18px}
.track{height:9px;border-radius:9px;background:var(--shell2);overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;background:var(--pink);transition:width .6s}
.st:nth-child(2) .track i{background:var(--gold)}
.st:nth-child(3) .track i{background:var(--baby)}
.st:nth-child(4) .track i{background:#c9b2ff}
.cmt{margin:0;font-size:21px;color:#ffffff;line-height:1.05}
.tip{margin:0;font-size:19px;color:var(--baby);line-height:1.05}
.combos{display:flex;flex-wrap:wrap;gap:5px}
.combos span{background:var(--gold);color:var(--shell);border-radius:999px;padding:3px 10px 1px;font-size:17px;font-weight:700}
.hint{margin:0;font-size:16px;color:var(--silver);opacity:.75;text-align:center}

@media (max-width:420px){.logo span{display:none}}
@media (max-height:620px){.it{width:48px;height:48px}.logo b{font-size:24px}.btn{font-size:20px;padding:5px 0 2px}.nailbox{width:72px;height:72px}.nailbox canvas{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){.bob,.dance{animation:none}.track i{transition:none}}
</style>
</head>
<body>

<div class="app">
  <div class="shell">
    <header class="top">
      <div class="logo"><b>갸루 데코샵</b><span>GAL★DECO</span></div>
      <button class="mini" id="bgm" aria-pressed="false">♫ BGM</button>
      <button class="mini" id="snd" aria-pressed="true">효과음</button>
    </header>
    <div class="stage" id="stage">
      <canvas id="view" width="80" height="150" class="bob" aria-label="꾸민 캐릭터"></canvas>
      <div class="meter">갸루력 <b id="live">00</b></div>
      <div class="nailbox" id="nailbox" hidden><canvas id="nailview" width="32" height="32"></canvas></div>
    </div>
    <nav class="groups" role="tablist" id="groups"></nav>
    <div class="scroll" id="subs"></div>
    <div class="cap"><b id="cap"></b><span id="capn"></span></div>
    <div class="scroll items" id="items"></div>
    <div class="scroll sw" id="sw"></div>
    <div class="bar">
      <button class="btn" id="rnd">랜덤</button>
      <button class="btn go" id="done">완성! 갸루력 판정</button>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="rh">
    <div class="rhead" id="rh">갸루력 판정 결과</div>
    <div class="rbody">
      <img id="shot" alt="완성한 갸루 코디">
      <div class="rinfo">
        <div class="grade" id="grade">S</div>
        <div class="rank" id="rank"></div>
        <div class="score">갸루력 <b id="score">0</b> / 100</div>
        <div class="stats" id="stats"></div>
      </div>
    </div>
    <div class="combos" id="combos"></div>
    <p class="cmt" id="cmt"></p>
    <p class="tip" id="tip"></p>
    <p class="hint">이미지를 길게 눌러 저장하거나 화면을 캡처해 공유해요</p>
    <button class="btn go" id="again">다시 꾸미기</button>
  </div>
</div>

<script>
(function(){
const W=80,H=150,INK='#2a1830',WH='#ffffff',BK='#26232e';
let X=null;
function R(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h)}
function RS(x,y,w,h,c){R(x,y,w,h,c);R(W-x-w,y,w,h,c)}
function P(rows,x,y,m){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const k=m[r[i]];if(k)R(x+i,y+j,1,1,k)}})}
function PS(rows,x,y,m){P(rows,x,y,m);P(rows.map(r=>[...r].reverse().join('')),W-x-rows[0].length,y,m)}
function F(sp,fn){for(const [y0,y1,x0,x1] of sp)for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const c=typeof fn==='function'?fn(x,y):fn;if(c)R(x,y,1,1,c)}}
const mir=sp=>sp.map(([a,b,c,d])=>[a,b,W-1-d,W-1-c]);
const both=sp=>sp.concat(mir(sp));
function wave(x,y0,y1,w,c,amp){for(let y=y0;y<=y1;y++)R(x+Math.round(Math.sin(y/4)*amp),y,w,1,c)}
function waveS(x,y0,y1,w,c,amp){for(let y=y0;y<=y1;y++){const o=Math.round(Math.sin(y/4)*amp);R(x+o,y,w,1,c);R(W-x-w-o,y,w,1,c)}}
function shade(h,a){const n=parseInt(h.slice(1),16),f=v=>Math.max(0,Math.min(255,v+a)).toString(16).padStart(2,'0');return '#'+f(n>>16)+f(n>>8&255)+f(n&255)}
function lum(h){const n=parseInt(h.slice(1),16);return .299*(n>>16)+.587*(n>>8&255)+.114*(n&255)}
const dk=c=>lum(c)<90?shade(c,45):shade(c,-48);
const lt=c=>lum(c)<90?shade(c,70):shade(c,35);
const ink2=c=>lum(c)>200?'#ff4fa3':WH;

/* ---------- 팔레트 ---------- */
const HAIRC=['#f2d27a','#efe2b8','#d9b48f','#a0683c','#5a3420','#22191a','#ff9ec7','#e0405a','#ff9a4d','#d6d6e6','#7fb0ff','#b99cff'];
const HAIRB=['1100','1100','0110','0010','0010','0001','1020','0102','0101','1002','1001','0120'];
const SKIN=['#fff3ea','#ffe6d6','#f6d0b0','#e8b890','#d9a07a','#c08860','#a8714f','#8a5a3c','#6a4028'];
const LENS=['#6b3a2a','#3b2a20','#8a8a9a','#5f8fd6','#ff6fae','#9a7ad6','#3f9a7f','#c08a3e'];
const LIP=['#ff5a8a','#e0607e','#c0304f','#ff8fb1','#d97a6a','#ffffff','#9a3a6a','#ff9a6a'];
const CL=['#26232e','#ffffff','#ff4fa3','#ffb3d4','#e8b46a','#ffcf4a','#2f3a6b','#8c8a96','#b99cff','#7fd0ff','#ff3b4f','#5a7fb8','#9fe3c9','#7a4a2a'];
const MET=['#ffcf4a','#e6e6f0','#ff8fc1','#fff8ee','#26232e','#7fd0ff'];
const NAILC=['#ff4fa3','#ffb3d4','#ffffff','#26232e','#e8b46a','#ff3b4f','#7fd0ff','#b99cff','#ffcf4a','#9fe3c9'];
const NAILART=['단색','프렌치','그라데','글리터','하트'];
const ARTB=['0000','0110','1100','2000','1010'];

/* ---------- 패턴 ---------- */
function leo(x,y,c){const a=(x*7+((y>>2)*3))%9,b=y&3;if((a===0&&b<2)||(a===1&&b===1))return '#3b2a20';if(a===2&&b===0)return shade(c,-35);return null}
const PAT={
 leo:c=>(x,y)=>leo(x,y,c)||c,
 zebra:c=>(x,y)=>(((x+(y>>1))%6)<2)?'#1d1a22':c,
 heart:c=>(x,y)=>{const a=x%6,b=y%6;return ((b===1&&(a===1||a===3))||(b===2&&a>=1&&a<=3)||(b===3&&a===2))?ink2(c):c},
 check:c=>(x,y)=>(x%6===2||y%4===1)?dk(c):(x%6===5)?'#d93a5a':c,
 denim:c=>(x,y)=>((x*3+y*5)%11===0)?lt(c):c,
 velvet:c=>(x,y)=>((x+y)%9===0)?lt(c):c,
 gingham:c=>(x,y)=>{const a=(x>>1)&1,b=(y>>1)&1;return a&&b?dk(c):(a||b)?c:WH},
 glitter:c=>(x,y)=>((x*7+y*3)%11===0)?WH:((x+y*2)%5===0)?lt(c):c,
 lace:c=>(x,y)=>((x+y)&1)?c:lt(c),
 rib:c=>(x)=>(x%3===0)?shade(c,lum(c)<90?20:-18):c
};

/* ---------- 체형 ---------- */
const BODY=[
 {n:'기본',s:'0010',ch:11,mh:10,wh:8,hh:9,tw:7,dL:0},
 {n:'슬림',s:'0101',ch:10,mh:9,wh:7,hh:8,tw:6,dL:2},
 {n:'글래머',s:'0300',ch:12,mh:10,wh:7,hh:11,tw:8,dL:0},
 {n:'모델 키',s:'0201',ch:11,mh:10,wh:8,hh:9,tw:7,dL:6},
 {n:'아담',s:'0030',ch:10,mh:9,wh:8,hh:9,tw:7,dL:-8},
 {n:'통통',s:'0120',ch:12,mh:12,wh:11,hh:11,tw:8,dL:-2}
];
function geom(B){const G={B,tor:{},leg:{}};
 for(let y=46;y<=77;y++)G.tor[y]=y===46?B.ch-2:y<=54?B.ch:y<=60?B.mh:y<=66?Math.round((B.mh+B.wh)/2):y<=70?B.wh:B.hh;
 G.au=40-B.ch-4;G.hlx=G.au-2;G.hrx=W-G.hlx-5;
 const a=Math.round(B.dL/2),b=B.dL-a,tw=B.tw;
 const thE=99+a,knE=thE+6,caE=knE+10+b,loE=caE+8,anE=loE+6;
 for(let y=78;y<=anE;y++){let x0;if(y<=thE)x0=y<=81?Math.min(39-tw,41-B.hh):39-tw;else if(y<=knE)x0=40-tw;else if(y<=caE)x0=39-tw;else if(y<=loE)x0=40-tw;else x0=41-tw;G.leg[y]=[x0,y>loE?37:38]}
 G.knee=thE+1;G.calf=knE+1;G.ank=loE+1;G.fy=anE+1;G.fx0=38-tw;return G}
function torsoF(G,y0,y1,fn,e){e=e||0;for(let y=y0;y<=y1;y++){const h=G.tor[y];if(h==null)continue;for(let x=40-h-e;x<=39+h+e;x++){const c=fn(x,y);if(c)R(x,y,1,1,c)}}}
function skirtF(G,y0,y1,fl,fn,h0){h0=h0==null?G.B.hh+1:h0;for(let y=y0;y<=y1;y++){const h=h0+Math.floor((y-y0)*fl);for(let x=40-h;x<=39+h;x++){const c=fn(x,y);if(c)R(x,y,1,1,c)}}}
function legF(G,y0,y1,fn,ex){for(let y=y0;y<=y1;y++){const r=G.leg[y];let x0,x1;if(r){x0=r[0];x1=r[1]}else if(y>=G.fy){x0=G.fx0;x1=38}else continue;const e=typeof ex==='function'?ex(y):(ex||0);for(let x=x0-e;x<=x1;x++){const c=typeof fn==='function'?fn(x,y):fn;if(c){R(x,y,1,1,c);R(W-1-x,y,1,1,c)}}}}
function sleeves(G,kind,fn,cuff){const a=G.au;
 const sp={long:[[47,66,a,a+3],[67,81,a-1,a+2]],short:[[47,55,a-1,a+3]],puff:[[46,46,a+1,a+3],[47,52,a-1,a+4]],bell:[[47,66,a,a+3],[67,75,a-1,a+2],[76,84,a-3,a+2]],off:[[53,81,a-1,a+3]]}[kind]||[];
 F(both(sp),fn);if(cuff){const cs=kind==='long'?[[82,84,a-1,a+2]]:kind==='off'?[[82,84,a-1,a+3]]:[];F(both(cs),cuff)}}

/* ---------- 얼굴 ---------- */
const FACES=[
 {n:'계란형',s:'0110',r:[[18,8],[19,36,10],[37,9],[38,8],[39,7],[40,5]]},
 {n:'둥근형',s:'0030',r:[[18,8],[19,38,10],[39,9],[40,7],[41,4]]},
 {n:'V라인',s:'0210',r:[[18,8],[19,32,10],[33,34,9],[35,8],[36,7],[37,6],[38,5],[39,4],[40,2]]},
 {n:'각진형',s:'0102',r:[[18,9],[19,38,10],[39,9],[40,8]]},
 {n:'하트형',s:'0120',r:[[18,9],[19,28,11],[29,32,10],[33,34,9],[35,8],[36,7],[37,6],[38,5],[39,3]]},
 {n:'긴 얼굴',s:'0201',r:[[18,7],[19,37,9],[38,8],[39,7],[40,6],[41,4]]},
 {n:'동안형',s:'0030',r:[[18,8],[19,35,10],[36,9],[37,8],[38,6],[39,4]]}
];
function faceRows(spec){const m={};spec.forEach(a=>{if(a.length===2)m[a[0]]=a[1];else for(let y=a[0];y<=a[1];y++)m[y]=a[2]});return m}
const BIG=['K.KKKKK','KKKKKKK','.KWHIIW','..WIDIW','..KIIK.','.N.NNN.'];
const EYES=[

function bgSched(){const sp=60/112/4;while(BG.next<AC.currentTime+.12){bgStep(BG.step,BG.next);BG.next+=sp;BG.step=(BG.step+1)&127}}
function bgOn(){bgInit();if(!BG.out)return;BG.on=true;BG.step=0;BG.next=AC.currentTime+.06;clearInterval(BG.timer);BG.timer=setInterval(bgSched,25);syncBgm()}
function bgOff(){BG.on=false;clearInterval(BG.timer);syncBgm()}
const bgmBtn=document.getElementById('bgm');
function syncBgm(){bgmBtn.setAttribute('aria-pressed',BG.on);bgmBtn.textContent=BG.on?'♫ BGM ON':'♫ BGM';document.getElementById('live').textContent=String(judge(S).score).padStart(2,'0')}
bgmBtn.onclick=()=>{BG.on?bgOff():bgOn()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&BG.on){BG.was=true;bgOff()}else if(!document.hidden&&BG.was){BG.was=false;bgOn()}});

/* ---------- UI ---------- */
const groupsEl=document.getElementById('groups'),subsEl=document.getElementById('subs'),itemsEl=document.getElementById('items'),swEl=document.getElementById('sw');
GROUPS.forEach((gr,i)=>{const b=document.createElement('button');b.className='grp';b.setAttribute('role','tab');b.id='grp-'+i;b.textContent=gr[0];b.onclick=()=>{cg=i;cur=lastSub[i];beep(620);ui(true)};groupsEl.appendChild(b)});

function thumb(cat,k,i){
 if(cat.nail){const cv=document.createElement('canvas');cv.width=32;cv.height=32;nailHand(cv.getContext('2d'),i,NAILC[S.nailC],S.nailArt,SKIN[S.skin]);return cv}
 const [x,y,w,h]=cat.crop,cv=document.createElement('canvas');cv.width=w;cv.height=h;
 renderTo(tx,Object.assign({},S,{[k]:i},(k==='face'||k==='skin')?{hair:10,bangs:5,ear:0,glass:0,head:0}:{}),k!=='bg');cv.getContext('2d').drawImage(T,x,y,w,h,0,0,w,h);return cv;
}
function ui(reset){
 const cat=CATS[cur];
 [...groupsEl.children].forEach((b,i)=>b.setAttribute('aria-selected',i===cg));
 subsEl.innerHTML='';
 GROUPS[cg][1].forEach(k=>{const b=document.createElement('button');b.className='sub';b.id='sub-'+k;b.textContent=CATS[k].lbl;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>{cur=k;lastSub[cg]=k;beep(740);ui(true)};subsEl.appendChild(b)});
 document.getElementById('cap').textContent=cat.items[S[cur]].n;
 document.getElementById('capn').textContent=(S[cur]+1)+' / '+cat.items.length+(cat.items.length>5?' · 옆으로 넘겨 보기':'');
 const keep=reset?null:itemsEl.scrollLeft;
 itemsEl.innerHTML='';
 cat.items.forEach((it,i)=>{
  const b=document.createElement('button');b.className='it';b.id='it-'+cur+'-'+i;b.setAttribute('aria-pressed',S[cur]===i);b.setAttribute('aria-label',it.n);b.title=it.n;
  if(it.n==='없음'){b.classList.add('empty');b.textContent='없음'}else b.appendChild(thumb(cat,cur,i));
  b.onclick=()=>{S[cur]=i;beep(880);draw();ui()};itemsEl.appendChild(b);
 });
 if(keep!=null)itemsEl.scrollLeft=keep;else{const sel=itemsEl.children[S[cur]];itemsEl.scrollLeft=sel?Math.max(0,sel.offsetLeft-itemsEl.offsetLeft-itemsEl.clientWidth/2+30):0}
 const swKeep=reset?0:swEl.scrollLeft;swEl.innerHTML='';
 (cat.sw||[]).forEach(grp=>{
  if(grp.lbl){const l=document.createElement('span');l.className='lbl';l.textContent=grp.lbl;swEl.appendChild(l)}
  if(grp.chips)grp.chips.forEach((t,i)=>{const b=document.createElement('button');b.className='chip';b.id='chip-'+grp.key+'-'+i;b.textContent=t;b.setAttribute('aria-pressed',S[grp.key]===i);b.onclick=()=>{S[grp.key]=i;beep(990);draw();ui()};swEl.appendChild(b)});
  else grp.pal.forEach((col,i)=>{const b=document.createElement('button');b.className='dot';b.id='sw-'+grp.key+'-'+i;b.style.background=col;b.setAttribute('aria-label',(grp.lbl||cat.lbl)+' 색 '+(i+1));b.setAttribute('aria-pressed',S[grp.key]===i);b.onclick=()=>{S[grp.key]=i;beep(990);draw();ui()};swEl.appendChild(b)});
 });
 if(!cat.sw){const l=document.createElement('span');l.className='lbl';l.textContent=cur==='bg'?'사진 찍을 장소를 골라요':cur==='skin'?'원하는 피부 톤을 골라요':'모양을 골라 내 얼굴을 만들어요';swEl.appendChild(l)}
 swEl.scrollLeft=swKeep;
 document.getElementById('nailbox').hidden=cur!=='nail';
}
function draw(){
 renderTo(vx,S);
 document.getElementById('stage').style.background=BGS[S.bg].base;
 nailHand(nv,S.nail,NAILC[S.nailC],S.nailArt,SKIN[S.skin]);
 document.getElementById('live').textContent=String(judge(S).score).padStart(2,'0');
 save();
}

const sb=document.getElementById('snd');const sl=()=>{sb.setAttribute('aria-pressed',sfx);sb.textContent=sfx?'효과음':'효과음 끔'};sl();
sb.onclick=()=>{sfx=!sfx;sl();save();beep(700)};
const ri=n=>Math.floor(Math.random()*n);
document.getElementById('rnd').onclick=()=>{
 Object.keys(CATS).forEach(k=>{const c=CATS[k];S[k]=ri(c.items.length);(c.sw||[]).forEach(gp=>S[gp.key]=ri((gp.pal||gp.chips).length))});
 [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f),i*60));draw();ui();
};

const modal=document.getElementById('modal');
document.getElementById('done').onclick=()=>{
 renderTo(vx,S);
 const big=document.createElement('canvas');big.width=W*4;big.height=H*4;const bx=big.getContext('2d');bx.imageSmoothingEnabled=false;bx.drawImage(view,0,0,big.width,big.height);
 document.getElementById('shot').src=big.toDataURL('image/png');
 const j=judge(S),top=j.combos.find(c=>'gksy'.includes(c[2]));
 let dom=0,low=0;j.t.forEach((v,i)=>{if(v>j.t[dom])dom=i;if(v<j.t[low])low=i});
 const rk=RANKS[top?top[2]:dom];
 document.getElementById('rank').textContent=rk[0];
 document.getElementById('cmt').textContent=rk[1];
 document.getElementById('tip').textContent=j.score>=97?'더 고칠 게 없어요. 이대로 프리쿠라 찍으러 가요!':'다음엔 '+TIPS[low];
 document.getElementById('grade').textContent=j.score>=90?'S':j.score>=80?'A':j.score>=68?'B':'C';
 const st=document.getElementById('stats');st.innerHTML='';
 j.t.forEach((v,i)=>{const r=document.createElement('div');r.className='st';r.innerHTML='<span>'+STL[i]+'</span><div class="track"><i style="width:0%"></i></div>';st.appendChild(r);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{r.querySelector('i').style.width=Math.min(100,v*100/28)+'%'}))});
 const cb=document.getElementById('combos');cb.innerHTML='';
 j.combos.forEach(c=>{const s=document.createElement('span');s.textContent='★ '+c[0]+' +'+c[1];cb.appendChild(s)});
 cb.hidden=!j.combos.length;
 const sc=document.getElementById('score');
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)sc.textContent=j.score;else{let n=0;const tm=setInterval(()=>{n=Math.min(j.score,n+4);sc.textContent=n;if(n>=j.score)clearInterval(tm)},25)}
 modal.hidden=false;[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*100));
 document.getElementById('again').focus();
};
const close=()=>{modal.hidden=true;beep(520)};
document.getElementById('again').onclick=close;
modal.onclick=e=>{if(e.target===modal)close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)close()});

function start(){draw();ui(true)}
window.claude?.hot?.ready?window.claude.hot.ready(start):start();
})();
</script>
